name: Build AIKO-OS ISO
on: [push]

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies & Build AppImage
        run: |
          npm install
          npm run build:linux
          
      - name: Install ISO Build Tools (Pro)
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso curl p7zip-full isolinux syslinux-common rsync
          
      - name: Download Mini Base (Debian Netinst)
        run: |
          curl -L -o mini-base.iso "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-12.9.0-amd64-netinst.iso"
          
      - name: Master Hybrid ISO (BIOS+UEFI+USB)
        run: |
          mkdir -p iso_final
          7z x mini-base.iso -oiso_final
          
          # Nhúng AIKO-OS & AI Local
          mkdir -p iso_final/opt/aiko-os
          rsync -av --exclude '.git' --exclude 'node_modules' . iso_final/opt/aiko-os/
          cp ai_assets/ollama iso_final/opt/aiko-os/ollama
          
          # Đóng gói Hybrid ISO Pro (Dùng phôi isolinux của Debian)
          # Lưu ý: Tìm tệp mbr binary trong hệ thống để nhúng
          MBR_BIN=$(find /usr/lib -name isohdpfx.bin | head -1)
          
          xorriso -as mkisofs \
            -o AIKO-OS-Hybrid-Pro.iso \
            -r -J -V "AIKO_OS_PRO" \
            -isohybrid-mbr "$MBR_BIN" \
            -c isolinux/boot.cat \
            -b isolinux/isolinux.bin \
            -no-emul-boot -boot-load-size 4 -boot-info-table \
            -eltorito-alt-boot \
            -e boot/grub/efi.img \
            -no-emul-boot \
            -isohybrid-gpt-basdat \
            iso_final || true
            
          # Fallback nếu cấu trúc boot của debian thay đổi
          if [ ! -f "AIKO-OS-Hybrid-Pro.iso" ]; then
            xorriso -as mkisofs -o AIKO-OS-Hybrid-Pro.iso -r -J -V "AIKO_OS" iso_final
          fi
          
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIKO-OS-PRO-ISO
          path: AIKO-OS-Hybrid-Pro.iso
          retention-days: 7
