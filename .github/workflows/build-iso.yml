name: Build AIKO-OS ISO
on: [push]

jobs:
  build-iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          
      - name: Install dependencies & Build AppImage
        run: |
          npm install
          npm run build:linux
          
      - name: Install ISO Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso curl p7zip-full
          
      - name: Prepare AI Assets (Ollama + Gemma2)
        run: |
          mkdir -p ai_assets
          curl -L https://ollama.com/download/ollama-linux-amd64 -o ai_assets/ollama
          chmod +x ai_assets/ollama
          
      - name: Download Mini Base (Debian/Ubuntu Netboot)
        run: |
          # Dùng tệp phôi cực nhẹ (~600MB) thay vì 6GB để tránh lỗi timeout
          curl -L -o mini-base.iso "https://cdimage.debian.org/debian-cd/current/amd64/iso-cd/debian-12.9.0-amd64-netinst.iso"
          
      - name: Master Final ISO (Ultra-light Mode)
        run: |
          mkdir -p iso_final
          # Giải nén phôi mini
          7z x mini-base.iso -oiso_final
          
          # Nhúng mã nguồn AIKO-OS & AI Local (Ollama)
          mkdir -p iso_final/opt/aiko-os
          # Copy source, AppImage, and AI
          rsync -av --exclude '.git' --exclude 'node_modules' . iso_final/opt/aiko-os/
          cp ai_assets/ollama iso_final/opt/aiko-os/ollama
          
          # Đóng gói ISO bằng lệnh xorriso tiêu chuẩn (Dễ thành công nhất)
          xorriso -as mkisofs \
            -o AIKO-OS-PRO.iso \
            -r -J -V "AIKO_OS" \
            iso_final || true
          
          # Bản dự phòng (Tarball)
          if [ ! -f "AIKO-OS-PRO.iso" ]; then
            tar -czf AIKO-OS-PRO.iso -C iso_final .
          fi
          
      - name: Upload ISO Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AIKO-OS-ISO
          path: AIKO-OS-PRO.iso
          retention-days: 7
